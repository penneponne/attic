[package]
name = "attic"
version.workspace = true
edition.workspace = true
publish = false

# The `[[test]]` below is not auto-discovered: it lives one directory down.
[[test]]
name = "parity_perft"
path = "tests/parity/perft.rs"

[dependencies]
attic-protocol = { path = "../attic-protocol", default-features = false }
attic-state = { path = "../attic-state", default-features = false }

# Global allocator for the shipped binary only; every library crate stays
# allocator-agnostic. `secure` is left off: it costs throughput for hardening
# this engine has no threat model for. The reference build uses the system
# allocator, so this is a performance divergence with no semantic effect.
mimalloc = "0.1"

# Pass-through only; see `attic-state/Cargo.toml`. This crate builds the shipped
# binary, so its default is what a release gets.
[features]
default = ["quick-draw"]
quick-draw = ["attic-protocol/quick-draw", "attic-state/quick-draw"]
# Network selection; exactly one is required. See attic-eval's features.
sfnn_halfkahm2_1536_15_32_k3k3 = ["attic-protocol/sfnn_halfkahm2_1536_15_32_k3k3"]
sfnn_halfkahm2_1024_15_64_progress8kpabs = ["attic-protocol/sfnn_halfkahm2_1024_15_64_progress8kpabs"]
sfnn_halfkahm2_1024_15_64_progress8ek = ["attic-protocol/sfnn_halfkahm2_1024_15_64_progress8ek"]
sfnn_halfkahm2_2304_15_64_progress8ek = ["attic-protocol/sfnn_halfkahm2_2304_15_64_progress8ek"]
sfnn_halfkahm2_threat_1024_15_64_8gp = ["attic-protocol/sfnn_halfkahm2_threat_1024_15_64_8gp"]
nnue_kp_256x2_32_32 = ["attic-protocol/nnue_kp_256x2_32_32"]
nnue_kp_128x2_32_32 = ["attic-protocol/nnue_kp_128x2_32_32"]
nnue_halfkp_256x2_32_32 = ["attic-protocol/nnue_halfkp_256x2_32_32"]
nnue_halfkp_128x2_32_32 = ["attic-protocol/nnue_halfkp_128x2_32_32"]
nnue_halfkp_768x2_16_64 = ["attic-protocol/nnue_halfkp_768x2_16_64"]
synn_token_128x2_32_32 = ["attic-protocol/synn_token_128x2_32_32"]
synn_kp_128x2_32_32 = ["attic-protocol/synn_kp_128x2_32_32"]
synn_kp_256x2_32_32 = ["attic-protocol/synn_kp_256x2_32_32"]
synn_token_256x2_32_32 = ["attic-protocol/synn_token_256x2_32_32"]
synn_halfkp_128x2_32_32 = ["attic-protocol/synn_halfkp_128x2_32_32"]
synn_token_128x2_32_32_pair16 = ["attic-protocol/synn_token_128x2_32_32_pair16"]
synn_token_128x2_32_32_pair16_o1 = ["attic-protocol/synn_token_128x2_32_32_pair16_o1"]
synn_token_128x2_32_32_pair16_o1_dual = ["attic-protocol/synn_token_128x2_32_32_pair16_o1_dual"]
synn_token_128x2_32_32_pair16_o1_dual_noskip = ["attic-protocol/synn_token_128x2_32_32_pair16_o1_dual_noskip"]
synn_token_128x2_32_32_pair16_o1_dual_nosqr = ["attic-protocol/synn_token_128x2_32_32_pair16_o1_dual_nosqr"]
synn_token_128x2_32_32_pair8_o1 = ["attic-protocol/synn_token_128x2_32_32_pair8_o1"]
synn_token_128x2_32_32_pair16_o1_hm = ["attic-protocol/synn_token_128x2_32_32_pair16_o1_hm"]
synn_token_128x2_32_32_pair16_o1_r4 = ["attic-protocol/synn_token_128x2_32_32_pair16_o1_r4"]
synn_token_128x2_32_32_pair16_o1_r2 = ["attic-protocol/synn_token_128x2_32_32_pair16_o1_r2"]
synn_token_128x2_32_32_pair16_o1_hc = ["attic-protocol/synn_token_128x2_32_32_pair16_o1_hc"]
synn_token_128x2_32_32_pair16_o1_r4hc = ["attic-protocol/synn_token_128x2_32_32_pair16_o1_r4hc"]
synn_token_32x2_32_32_pair32_o1_dual = ["attic-protocol/synn_token_32x2_32_32_pair32_o1_dual"]
synn_token_64x2_32_32_pair16_o1_dual = ["attic-protocol/synn_token_64x2_32_32_pair16_o1_dual"]
synn_token_32x2_32_32_pair24_o1_dual = ["attic-protocol/synn_token_32x2_32_32_pair24_o1_dual"]
synn_token_128x2_32_32_pair16_m8_f2 = ["attic-protocol/synn_token_128x2_32_32_pair16_m8_f2"]
hce_material_17 = ["attic-protocol/hce_material_17", "hce"]
hce_mobility_107_57 = ["attic-protocol/hce_mobility_107_57", "hce"]
# Qualifies one of the two shapes above; it is not a shape of its own.
hce_fit_qsearched = ["attic-protocol/hce_fit_qsearched"]
# Internal: every hand-crafted shape turns it on. They read no `nn.bin`, so the
# tests that expect a missing one to fail the load are gated on it. A `cfg`
# cannot see another crate's features, hence one copy per crate.
hce = []
ref_check_time = ["attic-protocol/ref_check_time"]
# A measuring build: count how often each layer of a SYNN head is on its floor or ceiling,
# and answer the `clipstats` command with it. Pass-through to `attic-eval`.
clip_stats = ["attic-protocol/clip_stats"]
# A checking build for the threat shape: every `do_move` rebuilds the accumulator from scratch.
threat_force_refresh = ["attic-protocol/threat_force_refresh"]

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
