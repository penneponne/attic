name: Integration

on:
  pull_request:
  push:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # `.cargo/config.toml` compiles for the host CPU (`-C target-cpu=native`),
  # which is right everywhere a binary runs on the machine that produced it.
  # These jobs are the one place that does not hold: `rust-cache` restores a
  # `target/` directory built on an earlier runner, the hosted runners are not
  # a single CPU model, and a native-built artifact dies with SIGILL on the
  # first instruction its new host lacks. An environment `RUSTFLAGS` overrides
  # the config file, and `rust-cache` folds `RUSTFLAGS` into its cache key, so
  # pinning a baseline every current x86-64 runner provides keeps the restored
  # artifacts runnable. Builds outside CI keep the native default.
  #
  # The pin also fixes which kernels these jobs cover: the AVX-512 forward pass
  # is selected by `cfg(target_feature = "avx512…")`, which x86-64-v3 does not
  # enable, so CI exercises the portable path. The AVX-512 kernels' own unit
  # tests enable their features per function and probe the CPU at run time, so
  # they still run on a runner that has the instructions. The two tests that
  # check a build matches its host are compiled only into a
  # `-C target-cpu=native` build (`attic-eval/build.rs` emits the cfg), so a
  # runner with AVX-512 VNNI is not expected to run the SIMD backend here.
  RUSTFLAGS: "-C target-cpu=x86-64-v3"

# The network shape is a build-time feature and exactly one must be selected
# (`attic-eval` refuses to compile with none or two), so `--all-features` can
# neither build nor test anything. Each job below runs once per shape instead.
# `args` is what follows `cargo <verb>` to pick it; the fourteenth entry is the
# build that must match YaneuraOu node for node (`ref_check_time` moves the
# time checks to where the reference's are), which turns off the defaults.
# The list is written out in each job on purpose: it is the same fourteen
# entries three times, and kept that way rather than behind a YAML anchor so that
# no workflow parser has to support one for CI to start at all.
#
# The Manaka shapes are the eight `synn` ones, and only two of them are rows here:
# each row builds the whole workspace and, in `test`, allocates a synthetic pair
# table of 175 MB several times over where the shape has one. `synn-token` is the
# power sums and the clip with no block beyond them, and `synn-token-pair16-m8-f2`
# is it with a pair table, a second moment and a square field, which is every
# place the forward pass branches on a block. The other six differ from those in
# the feature space, the width, the order or in having a pair table and no more,
# so they are only compiled and linted, in `synn-shapes` below.
# `nnue_kp_128x2_32_32` is linted there as well: it is KP256 at another width, and
# a constant is all it changes.
#
# Nothing here has a network file: the tests that read one skip with a notice
# when it is absent, so a green run says the code builds and its self-contained
# tests pass, not that the shape evaluates correctly. Two groups are the
# exception. The `synn` shapes build a network in memory and run it against a
# forward pass written from the definition, and against its own file format
# (`manaka/tests.rs`), though never against a trained one. The two hce shapes
# read no file at all: `hce_golden` runs in full and holds their feature vectors
# to the reference engine's own. Their fit variant
# (`hce_fit_qsearched`) changes only the coefficients, which that test does not
# read, so it is not a row of its own.
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wasm/core/package-lock.json
      - run: rustup target add wasm32-wasip1 wasm32-wasip1-threads
      - name: Build both WASM targets
        run: |
          unset RUSTFLAGS
          cargo build --locked --release -p attic-wasm --target wasm32-wasip1 --features hce_material_17
          cargo build --locked --release -p attic-wasm --target wasm32-wasip1-threads --features hce_material_17
      - run: cargo build --locked --release -p attic --features hce_material_17
      - run: npm --prefix wasm/core ci
      - run: npm --prefix wasm/core run build
      - name: Compare WASM and native USI searches
        run: >-
          timeout 30s node wasm/core/test/smoke.mjs
          target/wasm32-wasip1/release/attic_wasm.wasm
          target/wasm32-wasip1-threads/release/attic_wasm.wasm
          target/release/attic

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sfnn_halfkahm2_1536_15_32_k3k3
            args: --features sfnn_halfkahm2_1536_15_32_k3k3
          - name: sfnn_halfkahm2_1024_15_64_progress8kpabs
            args: --features sfnn_halfkahm2_1024_15_64_progress8kpabs
          - name: sfnn_halfkahm2_1024_15_64_progress8ek
            args: --features sfnn_halfkahm2_1024_15_64_progress8ek
          - name: sfnn_halfkahm2_2304_15_64_progress8ek
            args: --features sfnn_halfkahm2_2304_15_64_progress8ek
          - name: sfnn_halfkahm2_threat_1024_15_64_8gp
            args: --features sfnn_halfkahm2_threat_1024_15_64_8gp
          - name: nnue_kp_256x2_32_32
            args: --features nnue_kp_256x2_32_32
          - name: nnue_halfkp_256x2_32_32
            args: --features nnue_halfkp_256x2_32_32
          - name: nnue_halfkp_128x2_32_32
            args: --features nnue_halfkp_128x2_32_32
          - name: nnue_halfkp_768x2_16_64
            args: --features nnue_halfkp_768x2_16_64
          - name: synn_token_128x2_32_32
            args: --features synn_token_128x2_32_32
          - name: synn_token_128x2_32_32_pair16_m8_f2
            args: --features synn_token_128x2_32_32_pair16_m8_f2
          - name: hce_material_17
            args: --features hce_material_17
          - name: hce_mobility_107_57
            args: --features hce_mobility_107_57
          - name: yaneuraou-parity
            args: --no-default-features --features nnue_kp_256x2_32_32,ref_check_time
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo clippy --workspace --all-targets ${{ matrix.args }} -- -D warnings
      # The job above pins x86-64-v3, so the AVX-512 arms of `simd` are never
      # compiled here, and a shape can pass it and fail to build on a machine
      # that has the instructions: that is what #23 fixed. This second pass
      # compiles for an AVX-512 target without running anything. `--target`
      # keeps `RUSTFLAGS` away from the build scripts and proc macros, which
      # are built for the host and would die with SIGILL on a runner without
      # AVX-512 if they were compiled with those features.
      - name: clippy against an AVX-512 target
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+avx512f,+avx512bw,+avx512vnni,+avx512vl,+avx512dq
        run: |
          cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu \
            ${{ matrix.args }} -- -D warnings

  # A workspace-wide clippy pass covers the remaining SYNN shapes and NNUE KP
  # at 128, including lints that depend on shape constants. The radius shapes
  # also run evaluator tests to check that the cut keeps the intended pairs.
  synn-shapes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: synn-shapes
      - run: |
          for shape in \
            synn_token_128x2_32_32_pair16 \
            synn_token_128x2_32_32_pair16_o1 \
            synn_token_128x2_32_32_pair16_o1_dual \
            synn_token_128x2_32_32_pair16_o1_dual_noskip \
            synn_token_128x2_32_32_pair16_o1_dual_nosqr \
            synn_token_128x2_32_32_pair8_o1 \
            synn_token_128x2_32_32_pair16_o1_hm \
            synn_token_128x2_32_32_pair16_o1_r4 \
            synn_token_128x2_32_32_pair16_o1_r2 \
            synn_token_128x2_32_32_pair16_o1_hc \
            synn_token_128x2_32_32_pair16_o1_r4hc \
            synn_token_32x2_32_32_pair32_o1_dual \
            synn_token_64x2_32_32_pair16_o1_dual \
            synn_token_32x2_32_32_pair24_o1_dual \
            synn_kp_128x2_32_32 \
            synn_kp_256x2_32_32 \
            synn_token_256x2_32_32 \
            synn_halfkp_128x2_32_32 \
            nnue_kp_128x2_32_32; do
            echo "::group::$shape"
            cargo clippy --workspace --all-targets --features "$shape" -- -D warnings
            echo "::endgroup::"
          done
      - run: cargo test -p attic-eval --features synn_token_128x2_32_32_pair16_o1_r4
      - run: cargo test -p attic-eval --features synn_token_128x2_32_32_pair16_o1_r2
      - run: cargo test -p attic-eval --features synn_token_128x2_32_32_pair16_o1_hc
      - run: cargo test -p attic-eval --features synn_token_128x2_32_32_pair16_o1_r4hc

  # The `clip_stats` feature is a measuring build: a counter in the head of a SYNN net, and the
  # `clipstats` command that reads it. It is off in every build above, so nothing there compiles
  # it; this is where it is built, linted and tested. Two shapes, as the matrices use: the power
  # sums alone, and the one with a pair table, a second moment and a square field, which is every
  # block the counter lays out. Only the two crates that hold it are tested: the rest of the
  # workspace is the same code with the counter compiled out of it.
  clip-stats:
    name: clip_stats (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: synn_token_128x2_32_32
            shape: synn_token_128x2_32_32
          - name: synn_token_128x2_32_32_pair16_m8_f2
            shape: synn_token_128x2_32_32_pair16_m8_f2
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: clip-stats-${{ matrix.name }}
      - run: cargo clippy --workspace --all-targets --features ${{ matrix.shape }},clip_stats -- -D warnings
      - run: cargo test -p attic-eval -p attic-protocol --features ${{ matrix.shape }},clip_stats
      - run: cargo build --release -p attic --features ${{ matrix.shape }},clip_stats

  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sfnn_halfkahm2_1536_15_32_k3k3
            args: --features sfnn_halfkahm2_1536_15_32_k3k3
          - name: sfnn_halfkahm2_1024_15_64_progress8kpabs
            args: --features sfnn_halfkahm2_1024_15_64_progress8kpabs
          - name: sfnn_halfkahm2_1024_15_64_progress8ek
            args: --features sfnn_halfkahm2_1024_15_64_progress8ek
          - name: sfnn_halfkahm2_2304_15_64_progress8ek
            args: --features sfnn_halfkahm2_2304_15_64_progress8ek
          - name: sfnn_halfkahm2_threat_1024_15_64_8gp
            args: --features sfnn_halfkahm2_threat_1024_15_64_8gp
          - name: nnue_kp_256x2_32_32
            args: --features nnue_kp_256x2_32_32
          - name: nnue_halfkp_256x2_32_32
            args: --features nnue_halfkp_256x2_32_32
          - name: nnue_halfkp_128x2_32_32
            args: --features nnue_halfkp_128x2_32_32
          - name: nnue_halfkp_768x2_16_64
            args: --features nnue_halfkp_768x2_16_64
          - name: synn_token_128x2_32_32
            args: --features synn_token_128x2_32_32
          - name: synn_token_128x2_32_32_pair16_m8_f2
            args: --features synn_token_128x2_32_32_pair16_m8_f2
          - name: hce_material_17
            args: --features hce_material_17
          - name: hce_mobility_107_57
            args: --features hce_mobility_107_57
          - name: yaneuraou-parity
            args: --no-default-features --features nnue_kp_256x2_32_32,ref_check_time
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo build --release -p attic ${{ matrix.args }}

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sfnn_halfkahm2_1536_15_32_k3k3
            args: --features sfnn_halfkahm2_1536_15_32_k3k3
          - name: sfnn_halfkahm2_1024_15_64_progress8kpabs
            args: --features sfnn_halfkahm2_1024_15_64_progress8kpabs
          - name: sfnn_halfkahm2_1024_15_64_progress8ek
            args: --features sfnn_halfkahm2_1024_15_64_progress8ek
          - name: sfnn_halfkahm2_2304_15_64_progress8ek
            args: --features sfnn_halfkahm2_2304_15_64_progress8ek
          - name: sfnn_halfkahm2_threat_1024_15_64_8gp
            args: --features sfnn_halfkahm2_threat_1024_15_64_8gp
          - name: nnue_kp_256x2_32_32
            args: --features nnue_kp_256x2_32_32
          - name: nnue_halfkp_256x2_32_32
            args: --features nnue_halfkp_256x2_32_32
          - name: nnue_halfkp_128x2_32_32
            args: --features nnue_halfkp_128x2_32_32
          - name: nnue_halfkp_768x2_16_64
            args: --features nnue_halfkp_768x2_16_64
          - name: synn_token_128x2_32_32
            args: --features synn_token_128x2_32_32
          - name: synn_token_128x2_32_32_pair16_m8_f2
            args: --features synn_token_128x2_32_32_pair16_m8_f2
          - name: hce_material_17
            args: --features hce_material_17
          - name: hce_mobility_107_57
            args: --features hce_mobility_107_57
          - name: yaneuraou-parity
            args: --no-default-features --features nnue_kp_256x2_32_32,ref_check_time
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --workspace ${{ matrix.args }}
